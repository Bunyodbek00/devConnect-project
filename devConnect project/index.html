<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="page-header">
  <h1>Reading List</h1>
  <p class="subtitle">Books you mean to read, kept in one place.</p>
</header>

<main>
  <form id="add-form" class="add-form">
    <div class="add-form-fields">
      <label for="book-title">Title</label>
      <input id="book-title" name="title" type="text" placeholder="The Left Hand of Darkness" required>
      <label for="book-author">Author</label>
      <input id="book-author" name="author" type="text" placeholder="Ursula K. Le Guin" required>
    </div>
    <button type="submit" class="btn-primary">Add to list</button>
  </form>

  <section id="list-region" aria-live="polite">
    <!-- Loading / error / empty / list states are rendered here by app.js -->
  </section>
</main>

<footer class="reviewer-panel">
  <p class="reviewer-panel-label">Reviewer controls — force a state without editing code</p>
  <div class="reviewer-panel-buttons">
    <button type="button" id="force-loading" class="btn-ghost">Show loading state</button>
    <button type="button" id="force-error" class="btn-ghost">Show error state</button>
    <button type="button" id="force-empty" class="btn-ghost">Show empty state</button>
    <button type="button" id="force-reset" class="btn-ghost">Reset to normal</button>
  </div>
</footer>

<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
